# Design system tokens — SINGLE SOURCE OF TRUTH.
# Python loads this via tokens.py; remotion-app/src/tokens.ts is generated (scripts/gen_tokens_ts.py).
# Do NOT edit the generated .ts file directly.

brightness:
  dark_bg:
    l_min: 0.12
    l_max: 0.25
    body_text_l: 0.95        # body text on dark bg — near-white but not pure white (judgment)
    no_pure_black: true      # disallow #000000 / OKLCH L=0
  light_bg:
    l_min: 0.94
    l_max: 0.99
    no_pure_white: true      # disallow #FFFFFF / OKLCH L=1

accent:
  max_per_frame: 1           # at most one hero accent per frame
  min_luminance_contrast: 3.0  # accents separated by >=3:1 luminance contrast OR >=40 deg hue
  min_hue_separation: 40.0   # degrees

typography:
  # px at 1080 wide (9:16 Shorts frame)
  headline_min_px: 84
  secondary_min_px: 44
  caption_min_px: 56
  diagram_label_min_px: 36
  max_words_per_line: 6      # judgment — advisory
  max_words_per_scene: 12    # judgment — advisory

hold_floors:
  text_card_s: 3.5
  stat_s: 3.0
  something_new_every_s_min: 2.0
  something_new_every_s_max: 4.0

audio:
  target_lufs: -14.0
  true_peak_max_dbtp: -1.5
  music_under_speech_db: 19.0   # midpoint of 18-20 dB
  music_duck_db_min: 6.0
  music_duck_db_max: 12.0
  sfx_max_per_transition: 1

motion:
  # Easing bezier presets (name: [x1,y1,x2,y2])
  easings:
    out_expo:    [0.16, 1.0, 0.3, 1.0]
    out_cubic:   [0.33, 1.0, 0.68, 1.0]
    out_quart:   [0.25, 1.0, 0.5, 1.0]
    "in_out_cubic": [0.65, 0.0, 0.35, 1.0]
    in_cubic:    [0.32, 0.0, 0.67, 0.0]
  springs:
    smooth:   {damping: 200, stiffness: null}    # adult default (no bounce)
    snappy:   {damping: 20,  stiffness: 200}     # chips / numbers
    soft_pop: {damping: 12,  stiffness: 120}     # kids stickers only
    heavy:    {damping: 30,  mass: 2}            # large panels
  durations_frames:
    micro: [6, 9]
    word_text_entrance: [12, 15]
    element_entrance: [15, 20]
    camera_move: [24, 36]
    scene_transition_adult: [12, 18]
    scene_transition_kids: [15, 24]
    stagger_per_item: [3, 8]
    stagger_cap: 24

# These looks are banned; identity.py enforces them.
banned_defaults:
  - name: cream_serif_terracotta
    description: "cream background + serif font + terracotta accent — AI-default look for adults"
    condition: "bg OKLCH L>0.85 AND display font in serif list AND accent hue 20-60 deg"
  - name: near_black_acid_green
    description: "near-black background + acid green accent"
    condition: "bg OKLCH L<0.20 AND accent hue 120-150 AND chroma>0.18"
  - name: pure_black_background
    description: "pure #000000 background (OKLCH L==0)"
  - name: pure_white_background
    description: "pure #FFFFFF background (OKLCH L==1)"
  - name: full_screen_dark_linear_gradient
    description: "full-screen linear gradient on a dark background (banding in compressed video)"
