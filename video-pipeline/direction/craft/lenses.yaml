      pacing: "ASL 4-12 s; hold past the end of the action"
      sound: "room tone, wind, distant traffic; no music under the hardest fact"
      blocking: "nothing staged: the subject drifts off-centre, a foreground shoulder crosses once"
    is_not: ["a shake filter over a perfect frame", "lit corporate interview polish", "archival footage"]
    anchor_prompt: "Handheld at shoulder height, 35mm lens, operator-found; [subject] does [real task] in [real kind of place], drifts slightly off-centre and the camera corrects late; mixed window daylight and warm tungsten left uncorrected; a foreground shoulder crosses frame once; the shot keeps running after the action ends."
