- {id: avg-saas-launch, reason: "off-target (SaaS product demos); contains unsupported comparative claims and invented metrics."}
- {id: avg-personal-brand, reason: "off-target (founder/authority video); lighting and push-in content duplicate prompt-light-source."}
- {id: avg-course-promo, reason: "off-target (course sales) and unsafe: false scarcity, unreadable 'social proof flash' testimonials, placeholder proof stats captioned as real. The one-sentence hook test is in prompt-layer-order."}
- {id: avg-luxury-aesthetic, reason: "off-target genre; its generic prompt rules (settle hold after a move, speed as fraction of frame, calm negative space) were folded into prompt-motion-fill, prompt-measurable-language and prompt-faceless-narrated. Its 'specify what is absent' rule conflicts with prompt-positive-phrasing and is not adopted."}
- {id: avg-before-after, reason: "duplicate of arch-before-after; extras (physical cause for the transition, before as specific as after, end on the best after frame) are small and noted in prompt-faceless-narrated sources."}
- {id: avg-testimonial, reason: "unsafe: fabricated customer faces and metrics, fake platform attribution for ratings, ads designed not to read as ads. Off-target for explainers."}
