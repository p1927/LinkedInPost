  - id: real-no-unverified-drama
    title: Never dramatize an unverified claim or a real person
    summary: Explainer-specific; only supported claims get dramatized, and reconstructions never pose as footage of real people or events.
    severity: blocker
    failure: [fabricated footage, impersonation, dramatizing hearsay]
    mode_fit: [cold-open-drama, hybrid, documentary, explainer]
    stage: [script, shotlist, qa]
    rules:
      - "A claim verify.py marks unverifiable or unsupported may be narrated with hedging but never staged as a scene."
      - "Real named people appear as anonymous figures (suit, back view, silhouette); no likeness, no invented quotes."
      - "Reconstructions of real events read as illustration (style, framing, or a Remotion 'reconstruction' tag)."
