  - id: real-stranger-audit
    title: Stranger audit, every needed fact is said
    summary: A first-time viewer only has what is spoken or shown plainly; list the facts they need, pair each with the line that delivers it, and read the narration cold.
    severity: major
    failure: [viewer confusion, unspoken causal step, unexplained jump, uncounted resource]
    stage: [script, shotlist, qa]
    rules:
      - "Write the causal chain as facts, each paired with the exact narration or dialogue phrase that states it; no phrase means a gap."
      - "Read only the narration, top to bottom, as someone who never saw the plan; picture cannot carry a fact alone."
      - "Name every lead (character, mascot, machine) aloud in the first third, before it matters."
      - "If the story turns on a countable thing (seats, doses, minutes), say the count aloud where it matters and plant any exception earlier."
      - "Mark every jump in time or place: a picture-only dip or a Remotion place/time label, plus the line that names it."
      - "Viewer confusion is a script defect: find the unsaid fact; never answer it with regrade, retime or music."
    check: {type: mechanical, test: "Does every causal fact have a phrase that appears in the narration, and is every lead named before its first beat?", how: "proposed direction.causal_chain[] {fact, line}; lint: each line is a substring of some scenes[].narration; verify comprehension pass reads narration alone", lint: "causal_chain present when mode != explainer or claims >= 3"}
    sources: [aif-ref-story, aif-skill-core, verify.py, psychology_rules.md]
    confidence: craft-rule
    supersedes: [aif-ref-story]
    notes: "From ai-film's stranger audit (measured on remakes with dialogue). Our TTS narration plays the role of its dialogue, so the audit runs on narration plus any spoken lines. Counts are spoken by VO and shown by Remotion, never generated (real-text-counts). Dips are picture-only: sound and narration carry through (editing.yaml owns transitions)."

  - id: real-measured-evidence
    title: Measure, never glance
    summary: Evidence rules for the verifier lane; poses can be judged from stills, motion only from playback, and numbers beat impressions.
    severity: major
    failure: [false pass from one frame, motion misjudged from a still, mean hides outliers]
    stage: [qa]
    rules:
      - "Sample first, 15%, 50%, 85% and last frame per clip; never pass or fail a clip from one frame."
      - "Stills can verify size, composition, who is in frame, wardrobe, light direction; never actions, contact, weight, intent or timing."
      - "Motion check: frame-pair PSNR every 0.2 s; above 45 dB frozen, 30-40 dB breathing only, 18-28 dB clear motion, under 15 cut."
      - "Compare candidate takes at the same depth before choosing; a thumbnail-judged reject may be the usable take."
      - "Use percentiles, not means, for colour or brightness checks; a mean hides the one wrong shot."
      - "Transcribe the final mix with word timestamps: repeated words, false starts, late first word or prompt text spoken = fail."
      - "Any probe that returns nothing or a constant for every clip has failed (flow-lint-before-spend)."
    check: {type: mechanical, test: "Does each verdict cite sampled frames, and do motion verdicts cite playback or PSNR?", how: "verify CLIP lane writes frame times and PSNR curve per clip; dialects/hailuo.md has the PSNR procedure"}
    sources: [aif-idea-verification-procedure, aif-skill-core, h3s-skill-workflow-and-qa, "dialects/hailuo.md"]
    confidence: proposal
    supersedes: [aif-idea-verification-procedure]
    notes: "PSNR bands are h3-storyboard measurements on H3 [W, n=1, Chinese source]; treat as calibration, re-measure on our 768P clips. ai-film's three frames at 15/50/85 are extended with first/last for splice pairs (real-verifier-protocol). Face crops beside a reference photo apply to our generated canon frames only, never to photos of real people (real-no-unverified-drama)."
